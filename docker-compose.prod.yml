version: '3.8'

services:
  backend:
    build:
      target: prod
    environment:
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      target: prod
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
    ports:
      - "80:80"
    restart: always
